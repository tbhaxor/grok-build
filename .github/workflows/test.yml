name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt

      - name: rustfmt
        run: cargo fmt --all -- --check

  check:
    name: Check grok CLI
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - name: Install DotSlash
        run: |
          dest="${HOME}/.local/bin"
          mkdir -p "$dest"
          curl -LSfs "https://github.com/facebook/dotslash/releases/latest/download/dotslash-ubuntu-22.04.x86_64.tar.gz" | tar xz -C "$dest"
          echo "$dest" >> "$GITHUB_PATH"

      - name: Install protoc
        run: |
          dest="${HOME}/.local/bin"
          mkdir -p "$dest"
          curl -LSfs "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip" -o /tmp/protoc.zip
          unzip -qo /tmp/protoc.zip -d /tmp/protoc
          install -m 0755 /tmp/protoc/bin/protoc "$dest/protoc"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/protoc" --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: check

      - name: cargo check
        run: cargo check -p xai-grok-pager-bin
