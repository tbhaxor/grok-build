name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          targets: x86_64-unknown-linux-gnu

      - name: Install DotSlash
        run: |
          dest="${HOME}/.local/bin"
          mkdir -p "$dest"
          curl -LSfs "https://github.com/facebook/dotslash/releases/latest/download/dotslash-ubuntu-22.04.x86_64.tar.gz" | tar xz -C "$dest"
          echo "$dest" >> "$GITHUB_PATH"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release -p xai-grok-pager-bin --target x86_64-unknown-linux-gnu

      - name: Package binary
        run: |
          src="target/x86_64-unknown-linux-gnu/release/xai-grok-pager"
          cp "$src" grok-x86_64-unknown-linux-gnu
          chmod +x grok-x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-x86_64-unknown-linux-gnu
          path: grok-x86_64-unknown-linux-gnu


  release:
    name: Upload release binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
